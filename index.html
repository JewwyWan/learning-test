<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的学习主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #0f0f23; color: #e0e0e0;
    }
    .card {
      text-align: center; padding: 3rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; backdrop-filter: blur(20px);
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #7ee787; }
    p { opacity: 0.6; margin-bottom: 1.5rem; }
    .badges { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .badge {
      padding: 0.3rem 0.8rem; border-radius: 999px;
      font-size: 0.75rem; background: rgba(126,231,135,0.1);
      border: 1px solid rgba(126,231,135,0.3); color: #7ee787;
    }
    .footer { margin-top: 2rem; font-size: 0.75rem; opacity: 0.3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello World</h1>
    <p>这是我从零部署到 GitHub Pages 的第一个页面</p>
    <div class="badges">
      <span class="badge">Git</span>
      <span class="badge">GitHub Pages</span>
      <span class="badge">从零开始</span>
    </div>
    <div class="footer">2026-10-17 · Learning</div>
  </div>
</body>
</html>
